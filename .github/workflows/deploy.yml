name: Deploy to GitHub Pages

# 정식 사이트는 Vercel(main 자동 배포). GitHub Pages는 필요할 때만 수동 실행
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Supabase 주소·공개 키는 .env.production (저장소에 포함)
          # 로그인 화면의 회계법인 이름: 저장소 Variables의 FIRM_NAME (없으면 'Payday')
          VITE_FIRM_NAME: ${{ vars.FIRM_NAME }}
      # 새로고침/직접 접속 시 /employees 같은 경로도 앱이 열리도록 SPA fallback
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
